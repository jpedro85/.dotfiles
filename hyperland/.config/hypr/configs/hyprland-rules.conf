# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrule = suppress_event maximize, match:class .* # You'll probably like this.

windowrule = workspace 1, match:class ^(librewolf)$
windowrule = workspace 2, match:class ^(vesktop)$
windowrule = workspace 4, match:class ^(Spotify)$
windowrule = workspace 5, match:class ^(org.mozilla.Thunderbird)$
windowrule = no_focus on, match:class ^(jetbrains-.*)$, match:float 1, match:title ^win\d+$
windowrule = match:class cs2, immediate yes
