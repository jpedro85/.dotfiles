###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty
$fileManager = nemo
$menu = rofi -show drun
$browser = librewolf
$discord = vesktop
$email = thunderbird
$spotify = spotify-launcher

#################
### AUTOSTART ###
#################

# Autostart necessary processes and applications

# Set wallpaper and cursor theme
exec-once = hyprpaper

# Start status bar
exec-once = waybar -c ~/.config/waybar/config

# Disabled for now as I don't use it
# Might change to turn off monitor for when I use hyprlock
# exec-once = hypridle

# Network management and notifications
exec-once = nm-applet &
exec-once = dunst -conf .config/dunst/dunstrc

# Environment setup for Wayland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# Replaced now for the hyprland polkit agent
# exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = systemctl --user start hyprpolkitagent

# Start browser, discord, email client and spotify
exec-once = $browser
exec-once = $discord
exec-once = $email
exec-once = $spotify
